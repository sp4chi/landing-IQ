name: Automated EC2 CI/CD Deployment

on:
  push:
    branches:
      - aws-ec2-docker
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Commands & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.HOST || secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.EC2_KEY }}
          script: |
            echo "🚀 Starting automated deployment on EC2..."
            cd ~/landing-IQ || exit 1
            git fetch --all
            git checkout aws-ec2-docker
            git pull origin aws-ec2-docker
            docker compose -f docker-compose.prod.yml up -d --build || docker-compose -f docker-compose.prod.yml up -d --build
            docker system prune -f
            echo "✅ Deployment completed successfully!"
